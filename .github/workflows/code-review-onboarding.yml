name: Code Review Onboarding

# Reviews a model-onboarding PR. Runs one review agent per lens, then an aggregator agent
# that merges their findings and posts the review.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      lenses:
        description: JSON list of lens agents to run. Use one for a fast test.
        required: false
        type: string
        default: '["review-math-fidelity","review-data-path","review-dataset-evaluator","review-quantization","review-outside-model-work","review-flexible-shapes","review-app-contract","review-manifest","review-structure"]'

concurrency:
  group: code-review-onboarding-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: review (${{ matrix.agent }})
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(inputs.lenses) }}
    uses: qcom-eng-Nimbus/custom-templates/.github/workflows/breeze-agent-reusable.yaml@main
    secrets: inherit
    with:
      agent_name: "${{ matrix.agent }}"
      sub_category: "model-onboarding-review"
      track_progress: false
      claude_output_mode: "none"
      max_turns: 80
      artifact_upload: "review-findings/${{ matrix.agent }}.md"
      base_allowed_tools: >-
        Bash(python:*),
        Bash(python3:*),
        Bash(pre-commit:*),
        Bash(pip:*),
        Bash(pytest:*),
        Bash(git status:*),
        Bash(git log:*),
        Bash(git diff:*),
        Bash(git show:*),
        Bash(git branch:*),
        Bash(git checkout:*),
        Bash(git stash:*),
        Bash(git fetch:*),
        Bash(git merge-base:*),
        Bash(git rev-parse:*),
        Bash(git ls-files:*),
        Bash(gh:*),
        Bash(qai-hub-models:*),
        Bash(qai-hub:*),
        Bash(git clone:*),
        Bash(grep:*),
        Bash(ls:*),
        Bash(find:*),
        Bash(cat:*),
        Bash(head:*),
        Bash(tail:*),
        Bash(wc:*),
        Bash(diff:*),
        Bash(mkdir:*),
        WebFetch,
        Read,
        Write(//tmp/claude/**),
        Write(review-findings/**),
        Edit(//tmp/claude/**),
        Edit(review-findings/**)
      prompt: >-
        Review PR #${{ inputs.pr_number }} in ${{ github.repository }} as the ${{ matrix.agent }} reviewer.
        Nothing has run Phase 1 for you, so do the Phase 1 scoping from
        .agents/skills/model-onboarding-review/SKILL.md yourself, then apply only your lens.
        Do not post anything to GitHub. Write your report in the SKILL.md report format to
        review-findings/${{ matrix.agent }}.md. Write the file even when you have no findings.
        A separate aggregator agent merges the reports and posts the review.

  aggregate:
    name: aggregate
    needs: review
    if: ${{ !cancelled() }}
    uses: qcom-eng-Nimbus/custom-templates/.github/workflows/breeze-agent-reusable.yaml@main
    secrets: inherit
    with:
      agent_name: "review-aggregator"
      sub_category: "model-onboarding-review"
      track_progress: false
      claude_output_mode: "none"
      max_turns: 80
      fetch_pr_thread_state: true
      additional_permissions: |
        actions: read
      base_allowed_tools: >-
        Bash(gh api:*),
        Bash(gh pr view:*),
        Bash(gh pr diff:*),
        Bash(gh pr list:*),
        Bash(gh pr review:*),
        Bash(gh pr comment:*),
        Bash(gh run download:*),
        Bash(git show:*),
        Bash(git diff:*),
        Bash(git log:*),
        Bash(git rev-parse:*),
        Bash(grep:*),
        Bash(ls:*),
        Bash(cat:*),
        Bash(head:*),
        Bash(wc:*),
        Bash(mkdir:*),
        Read,
        Write(//tmp/claude/**),
        Edit(//tmp/claude/**)
      prompt: >-
        Aggregate the lens reviews for PR #${{ inputs.pr_number }} in ${{ github.repository }}.
        The lens agents ran in workflow run ${{ github.run_id }} and the review job result was
        ${{ needs.review.result }}. The lenses that ran are: ${{ inputs.lenses }}. Expect only
        those, and don't mark other lenses as missing. If fewer than all of them ran, don't
        approve. Follow .agents/agents/review-aggregator.md to collect their
        findings, merge them, decide the verdict, and post the review.
