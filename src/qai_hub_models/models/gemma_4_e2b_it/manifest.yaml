technical_details:
  Model architecture: Transformer with SigLIP-style ViT Vision Encoder, Per-Layer Embeddings (PLE), interleaved sliding-window/global attention with Grouped Query Attention (GQA), and shared KV layers.
  Number of parameters: 2B (effective)
  Response Rate: Rate of response generation after the first response token.
  Supported languages: Multilingual (trained on 140+ languages)
  TTFT: Time To First Token is the time it takes to generate the first response token. This is expressed as a range because it varies based on the length of the prompt.
