name: U2Net-Segmentation
id: u2net_segmentation
status: pending
headline: Salient object segmentation for high-quality foreground extraction.
domain: Computer Vision
description: U2-Net is a machine learning model for salient object detection and
  foreground extraction. It uses a two-level nested U-structure (RSU blocks) to capture
  both local and global context at multiple scales, producing high-quality binary
  foreground masks. The model is trained on the DUTS dataset and is well-suited for
  background removal, portrait segmentation, and object extraction on mobile and edge
  devices.
use_case: Semantic Segmentation
tags: [real-time]
applicable_scenarios:
- Background Removal
- Portrait Segmentation
- E-Commerce Product Imaging
