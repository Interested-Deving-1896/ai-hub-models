      scorecard_failure: 'Compile failed: TFLite does not support uint16 activation quantization (QuantizeLinear output dtype uint16 rejected). WeDetectDetector component_precision is w8a16 which is incompatible with TFLite. Failing jobs: jp8xqe8og'
