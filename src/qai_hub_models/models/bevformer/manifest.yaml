technical_details:
  Input preprocessing: Images must be ImageNet mean/std normalized before inference; the model does not normalize internally.
  Input resolution: 6 x 3 x 480 x 800
  Model checkpoint: bevformer_tiny_deformable_optimized_exp_86_epoch_24.pth
  Model size: 120 MB
  Number of parameters: 27M
