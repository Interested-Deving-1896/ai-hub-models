# nuScenes is declared for metadata/discovery; it is not yet consumed for
# accuracy eval (Phase 1 is export-only: no evaluator, scorecard skip_evaluate).
# Wiring the nuScenes evaluator is tracked for a later phase.
dataset:
  - nuscenes
datasets:
  - nuscenes
has_on_target_demo: true
supported_precisions:
  - float
disabled_paths:
  float:
    tflite:
      scorecard_failure: 'Failing jobs: j56d7rlnp'
# mmcv 1.7.0 and mmdet3d 1.0.0rc4 are both source builds whose setup.py imports
# pkg_resources, which setuptools 82.0.0 removed. Neither declares a
# build-system, so an isolated PEP 517 build pulls the newest setuptools (>=82)
# and dies with "No module named 'pkg_resources'". Install pre-82 setuptools +
# wheel first, then build both --no-build-isolation so they see it. mmdet3d also
# declares a wrong numba==0.53.0 pin (py<=3.9 only) that conflicts with our numba
# 0.59.1, so --no-deps (its real runtime deps are pinned in requirements.txt).
# Building mmcv here (not letting the main [bevformer] install resolve it) is
# what keeps it out of an isolated build env.
pre_pip_install_commands:
- pip install wheel "setuptools<82.0.0"
- pip install mmcv==1.7.0 --no-deps --no-build-isolation
- pip install git+https://github.com/open-mmlab/mmdetection3d.git@v1.0.0rc4 --no-deps --no-build-isolation
