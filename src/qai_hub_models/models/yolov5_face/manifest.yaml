name: YoloV5-Face
id: yolov5_face
status: pending
headline: Real-time face detection with 5-point facial landmark estimation on mobile and edge devices.
domain: Computer Vision
description: YoloV5-Face-Nano is a lightweight single-class face detector based on the YoloV5 backbone (StemBlock + ShuffleV2Block). Each detected face is accompanied by 5 facial landmark predictions (left eye, right eye, nose, left mouth corner, right mouth corner). Trained on the WiderFace dataset.
use_case: Object Detection
tags:
- real-time
applicable_scenarios:
- Camera
- Face Authentication
- Augmented Reality
related_models:
