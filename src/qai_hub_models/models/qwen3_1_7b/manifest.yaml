name: Qwen3-1.7B
id: qwen3_1_7b
status: published
headline: Multilingual 1.7B parameter language model excelling in reasoning and code generation.
domain: Generative AI
description: Qwen3 is a multilingual large language model series from Alibaba Cloud, excelling in language understanding, generation, coding, and mathematics.
use_case: Text Generation
tags:
- llm
- generative-ai
research_paper: https://arxiv.org/abs/2505.09388
research_paper_title: Qwen3 Technical Report
license: https://huggingface.co/Qwen/Qwen3-1.7B/blob/main/LICENSE
source_repo: https://huggingface.co/Qwen/Qwen3-1.7B
technical_details:
  Model architecture: Dense Transformer with Grouped Query Attention (GQA) and SwiGLU activation.
  Supported languages: 100+ languages and dialects
  TTFT: Time To First Token is the time it takes to generate the first response token. This is expressed as a range because it varies based on the length of the prompt.
  Response Rate: Rate of response generation after the first response token.
applicable_scenarios:
- Dialogue
- Content Generation
related_models:
- qwen3_0_6b
- qwen3_4b
form_factors:
- Phone
- Tablet
- IoT
has_static_banner: true
has_animated_banner: true
license_type: apache-2.0
dataset: []
restrict_model_sharing: false
model_type_llm: true
llm_details:
  call_to_action: Download and View Readme
  geniex_llamacpp_compatible: true
  genie_compatible: true
  devices: {}
lm_quantization_details:
  w4a16:
    precision:
      blocks:
        qtype: int4
        granularity: PCQ
      lm_head:
        qtype: int8
        granularity: PCQ
      kv_cache: int8
      activations: int16
    recipe:
      - name: SpinQuant
        enable_r1: true
        enable_r2: false
        enable_r3: true
      - name: AdaScale
        num_batches: 128
        num_iterations: 2048
        dataset:
          name: Wikitext
          split: train
      - name: Calibration
        num_iterations: 20
        dataset:
          name: Wikitext
          split: train
runtime_technical_details:
  geniex_qairt:
    model_infer_id: ai-hub-models/Qwen3-1.7B
    Input sequence length for Prompt Processor: '128'
    Context lengths: 512, 1024, 2048, 3072, 4096
    Minimum QNN SDK version required: 2.45.0
    Supported Input Modalities: text
    Supported Output Modalities: text
  geniex_llamacpp:
    model_infer_id: unsloth/Qwen3-1.7B-GGUF
    Quantization Type: Q4_0 (GGUF)
    Model Size: 1.06 GB
    Supported Input Modalities: text
    Supported Output Modalities: text
numerics_benchmark:
  dataset_name: grace2
  metric_name: Grace2
  value: 81.2
  unit: '%'
  source: AI Hub Models Reference Eval
is_aimet: true
supported_precisions:
- w4a16
is_collection_model: true
requires_aot_prepare: true
orchestrator_runtimes:
- geniex_qairt
- geniex_llamacpp
- genie
only_allow_orchestrator_runtimes: true
local_device_deployment: true
has_multi_graph: true
separate_quantize_script: true
templates:
- llm
- lm_driver
- qwen3
post_pip_install_commands:
- command: pip uninstall -y onnxruntime
  machine: gpu
- command: pip install onnxruntime-gpu==1.23.2 aimet-onnx==2.34.0
  machine: gpu
