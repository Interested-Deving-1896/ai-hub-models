name: Llama-v3.1-8B-Instruct
id: llama_v3_1_8b_instruct
status: published
headline: State-of-the-art large language model useful on a variety of language understanding and generation tasks.
domain: Generative AI
description: Llama 3 is a family of LLMs. The model is quantized to w4a16 (4-bit weights and 16-bit activations) and part of the model is quantized to w8a16 (8-bit weights and 16-bit activations) making it suitable for on-device deployment. For Prompt and output length specified below, the time to first token is Llama-PromptProcessor-Quantized's latency and average time per addition token is Llama-TokenGenerator-Quantized's latency.
use_case: Text Generation
tags:
- llm
- generative-ai
applicable_scenarios:
- Dialogue
- Content Generation
- Customer Support
related_models:
- llama_v3_8b_instruct
- llama_v3_2_3b_instruct
form_factors:
- Phone
- Tablet
- IoT
has_static_banner: true
has_animated_banner: true
dataset: []
technical_details:
  Language(s) supported: English.
  TTFT: Time To First Token is the time it takes to generate the first response token. This is expressed as a range because it varies based on the length of the prompt. The lower bound is for a short prompt (up to 128 tokens, i.e., one iteration of the prompt processor) and the upper bound is for a prompt using the full context length (4096 tokens).
  Response Rate: Rate of response generation after the first response token.
license_type: llama3
research_paper: https://www.llama.com/docs/model-cards-and-prompt-formats/llama3_1/
research_paper_title: 'LLaMA: Open and Efficient Foundation Language Models'
source_repo: https://github.com/meta-llama/llama3/tree/main
license: https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct/blob/main/LICENSE
restrict_model_sharing: true
model_type_llm: true
llm_details:
  call_to_action: View Readme
  genie_compatible: true
  devices: {}
lm_quantization_details:
  w4a16:
    precision:
      blocks:
        qtype: int4
        granularity: PCQ
      lm_head:
        qtype: int8
        granularity: PCQ
      kv_cache: int8
      activations: int16
    recipe:
      - name: SeqMSE
        num_iterations: 20
        dataset:
          name: Wikitext
          split: train
      - name: Calibration
        num_iterations: 20
        dataset:
          name: Wikitext
          split: train
runtime_technical_details:
  geniex_qairt:
    Input sequence length for Prompt Processor: '128'
    Maximum context length: '4096'
    Quantization Type: w4a16 + w8a16 (few layers)
    Supported Input Modalities: text
    Supported Output Modalities: text
numerics_benchmark:
  dataset_name: grace2
  metric_name: Grace2
  value: 90.5
  unit: '%'
  source: AI Hub Models Reference Eval
is_aimet: true
supported_precisions:
- w4a16
is_collection_model: true
requires_aot_prepare: true
orchestrator_runtimes:
- geniex_qairt
- genie
only_allow_orchestrator_runtimes: true
local_device_deployment: true
has_multi_graph: true
separate_quantize_script: true
templates:
- llama3
- llm
- lm_driver
post_pip_install_commands:
- command: pip uninstall -y onnxruntime
  machine: gpu
- command: pip install onnxruntime-gpu==1.23.2 aimet-onnx==2.28.0
  machine: gpu
