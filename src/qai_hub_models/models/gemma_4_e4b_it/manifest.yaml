name: Gemma-4-E4B-it
id: gemma_4_e4b_it
status: published
headline: Multimodal model from Google DeepMind handling text and image input.
domain: Generative AI
description: Gemma is a family of open models built by Google DeepMind. Gemma 4 models are multimodal, handling text and image input (with audio supported on small models) and generating text output. This release includes open-weights models in both pre-trained and instruction-tuned variants. Gemma 4 features a context window of up to 256K tokens and maintains multilingual support in over 140 languages.
use_case: Text Generation
tags:
- llm
- vlm
- generative-ai
research_paper: https://blog.google/innovation-and-ai/technology/developers-tools/gemma-4/
research_paper_title: 'Gemma 4'
license: https://ai.google.dev/gemma/apache_2
source_repo: https://huggingface.co/google/gemma-4-E4B-it
technical_details:
  Model architecture: Transformer with SigLIP-style ViT Vision Encoder, Per-Layer Embeddings (PLE), interleaved sliding-window/global attention with Grouped Query Attention (GQA), and shared KV layers.
  Input sequence length for Prompt Processor: '128'
  Use: Initiate conversation with prompt-processor and then token generator for subsequent iterations.
  Number of parameters: 4B (effective)
  Precision: w4a16
  Minimum QNN SDK version required: 2.45.0
  Supported languages: Multilingual (trained on 140+ languages)
  TTFT: Time To First Token is the time it takes to generate the first response token. This is expressed as a range because it varies based on the length of the prompt.
  Response Rate: Rate of response generation after the first response token.
applicable_scenarios:
- Dialogue
- Content Generation
related_models:
- gemma_4_e2b_it
- gemma_3n_e4b_it
form_factors:
- Phone
- Tablet
- IoT
has_static_banner: true
has_animated_banner: true
license_type: apache-2.0
dataset: []
restrict_model_sharing: false
model_type_llm: true
llm_details:
  call_to_action: Download and View Readme
  geniex_llamacpp_compatible: true
  genie_compatible: true
runtime_technical_details:
  geniex_qairt:
    model_infer_id: ai-hub-models/Gemma-4-E4B-it
    Input sequence length for Prompt Processor: '128'
    Context lengths: '4096'
    Minimum QNN SDK version required: 2.45.0
    Supported Input Modalities: image, text
    Supported Output Modalities: text
    Note: This model is still under Developer Preview. We're working to further improve the quantization and accuracy on-device. It has known issues with repetitive words, formatting and code related questions. We recommend leveraging the geniex llamacpp plugin based model (quantization technique q4_0) for more accurate responses.
  geniex_llamacpp:
    model_infer_id: google/gemma-4-E4B-it-qat-q4_0-gguf
    Quantization Type: Q4_0 (GGUF)
    Model Size: 4.84 GB
    Supported Input Modalities: image, text, audio
    Supported Output Modalities: text
