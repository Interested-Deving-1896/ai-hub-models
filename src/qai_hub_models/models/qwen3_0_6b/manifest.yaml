name: Qwen3-0.6B
id: qwen3_0_6b
status: published
headline: State-of-the-art large language model useful on a variety of language understanding
  and generation tasks.
domain: Generative AI
description: The Qwen3-0.6B is a state-of-the-art multilingual language model with
  0.6 billion parameters, excelling in language understanding, generation, coding,
  and mathematics.
use_case: Text Generation
tags:
- llm
- generative-ai
applicable_scenarios:
- Dialogue
- Content Generation
- Customer Support
related_models:
- qwen2_5_7b_instruct
form_factors:
- Phone
- Tablet
- IoT
has_static_banner: true
has_animated_banner: true
dataset: []
technical_details:
  Supported languages: 100+ languages and dialects.
  TTFT: Time To First Token is the time it takes to generate the first response token.
    This is expressed as a range because it varies based on the length of the prompt.
    The lower bound is for a short prompt (up to 128 tokens, i.e., one iteration of
    the prompt processor) and the upper bound is for a prompt using the full context
    length (4096 tokens).
  Response Rate: Rate of response generation after the first response token.
license_type: apache-2.0
research_paper: https://arxiv.org/abs/2505.09388
research_paper_title: Qwen3 Technical Report
source_repo: https://github.com/QwenLM/Qwen3
license: https://huggingface.co/Qwen/Qwen3-0.6B/blob/main/LICENSE
model_type_llm: true
llm_details:
  call_to_action: Download and View Readme
  genie_compatible: true
  geniex_llamacpp_compatible: true
  devices: {}
lm_quantization_details:
  w4a16:
    precision:
      blocks:
        qtype: int4
        granularity: PCQ
      lm_head:
        qtype: int8
        granularity: PCQ
      kv_cache: int8
      activations: int16
    recipe:
      - name: SpinQuant
        enable_r1: false
        enable_r2: true
        enable_r3: true
      - name: AdaScale
        num_batches: 128
        num_iterations: 2048
        dataset:
          name: Wikitext
          split: train
      - name: Calibration
        num_iterations: 20
        dataset:
          name: Interleaved
          source_datasets:
            - name: Wikitext
              split: train
            - name: GeneratedDataset
runtime_technical_details:
  geniex_qairt:
    Input sequence length for Prompt Processor: '128'
    Context lengths: 512, 1024, 2048, 3072, 4096
    Minimum QNN SDK version required: 2.45.0
    Supported Input Modalities: text
    Supported Output Modalities: text
  geniex_llamacpp:
    model_infer_id: unsloth/Qwen3-0.6B-GGUF
    Quantization Type: Q4_0 (GGUF)
    Model Size: 429 MB
    Supported Input Modalities: text
    Supported Output Modalities: text
numerics_benchmark:
  dataset_name: grace2
  metric_name: Grace2
  value: 71.4
  unit: '%'
  source: AI Hub Models Reference Eval
is_aimet: true
supported_precisions:
- w4a16
- q4_0
is_collection_model: true
requires_aot_prepare: true
orchestrator_runtimes:
- geniex_qairt
- geniex_llamacpp
- genie
only_allow_orchestrator_runtimes: true
local_device_deployment: true
has_multi_graph: true
separate_quantize_script: true
post_pip_install_commands:
- command: pip uninstall -y onnxruntime
  machine: gpu
- command: pip install onnxruntime-gpu==1.23.2 https://github.com/quic/aimet/releases/download/2.35.0/aimet_onnx-2.35.0+cu126-cp310-abi3-manylinux_2_34_x86_64.whl -f https://download.pytorch.org/whl/torch_stable.html
  machine: gpu
