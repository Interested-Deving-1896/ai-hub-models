name: Parakeet-TDT-0.6B-v3
id: parakeet_tdt
status: pending
headline: Multilingual automatic speech recognition (ASR) model supporting English and 25 European languages with Token-and-Duration Transducer (TDT) architecture.
disabled_paths:
  float:
    tflite:
      scorecard_failure: 'Failing jobs: jg9o0ojlg'
