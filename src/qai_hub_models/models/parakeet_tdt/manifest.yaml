domain: Audio
description: Parakeet-TDT-0.6B-v3 is a 600M-parameter ASR model by NVIDIA using TDT architecture with a FastConformer encoder and 2-layer LSTM predictor, split into Encoder, Decoder, and Joint components for efficient on-device inference across English and 25 European languages.
use_case: Speech Recognition
tags:
- foundation
- real-time
applicable_scenarios:
- Voice Assistants
- Transcription Services
- Accessibility
- Smart Home
- Real-time Transcription
related_models:
- whisper_base
- whisper_small
- deepspeech2
form_factors:
- Phone
- Tablet
- IoT
has_static_banner: true
has_animated_banner: false
dataset:
- libri_speech
technical_details:
  Model checkpoint: nvidia/parakeet-tdt-0.6b-v3
  Input resolution: 128 mel bins x variable time (16kHz mono audio)
  Supported languages: English + 25 European languages
  Number of parameters (encoder): 609.5M  # FastConformer (608.9M) + encoder projector (0.66M)
  Model size (encoder) (float): 2270 MB
  Number of parameters (decoder): 12.2M
  Model size (decoder) (float): 47 MB
  Number of parameters (joint): 5.3M
  Model size (joint) (float): 20 MB
  Total parameters: 627.0M
  Vocabulary size: 8193 (8192 BPE + 1 blank)
  TDT durations: 5 (0,1,2,3,4 frames)
  WER (LibriSpeech test-clean): 1.93%
  WER (LibriSpeech test-other): 3.59%
numerics_benchmark:
  dataset_name: libri_speech
  metric_name: Word Error Rate
  source: https://github.com/qcom-ai-hub/tetracode/issues/22220
  unit: WER
  value: 3.964

license_type: cc-by-4.0
research_paper: https://arxiv.org/abs/2509.14128
research_paper_title: 'Canary-1B-v2 & Parakeet-TDT-0.6B-v3: Efficient and High-Performance Models for Multilingual ASR and AST'
source_repo: https://github.com/NVIDIA/NeMo
license: https://creativecommons.org/licenses/by/4.0/legalcode.en
supported_precisions:
  - float
  - mixed_with_float
  - mixed
