name: Pyannote-Speaker-Diarization
id: pyannote_speaker_diarization
status: pending
headline: Open-source speaker diarization model identifying "who spoke when" in audio recordings.
domain: Audio
description: >
  Pyannote Speaker Diarization is an open-source speaker diarization model that
  identifies "who spoke when" in an audio recording. It detects per-frame speaker
  activity and encodes speaker identity, enabling accurate multi-speaker attribution
  in meetings, interviews, and other multi-party conversations.
use_case: Audio Classification
tags:
- foundation
applicable_scenarios:
- Meeting Transcription
- Smart Home
- Accessibility
related_models:
- whisper_small
form_factors:
- Phone
- Tablet
has_static_banner: true
has_animated_banner: false
technical_details:
  Model checkpoint: pyannote/speaker-diarization-3.1
  Input resolution (segmentation): "32 x 1 x 80000 (batch x channel x 5s at 16kHz)"
  Input resolution (embedding): "32 x 498 x 80 (batch x frames x mel-bins)"
  Number of speakers (segmentation output): 7 (powerset encoding for up to 3 speakers)
  Quantization: Segmentation float, Embedding W8A16 via AI Hub
license_type: mit
research_paper: https://arxiv.org/abs/1911.01255
research_paper_title: "pyannote.audio: neural building blocks for speaker diarization"
source_repo: https://github.com/pyannote/pyannote-audio
license: https://github.com/pyannote/pyannote-audio/blob/main/LICENSE
supported_precisions:
- mixed_with_float
is_collection_model: true
requires_aot_prepare: true
orchestrator_runtimes:
- voice_ai
only_allow_orchestrator_runtimes: true
