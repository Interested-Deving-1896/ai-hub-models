name: SigLIP2
id: siglip2
status: pending
headline: Zero-shot image-text similarity and classification using SigLIP2.
domain: Multimodal
description: SigLIP2 (Sigmoid Loss for Language-Image Pre-training 2) is a vision-language
  model from Google that computes cosine-similarity scores between images and text
  prompts. It can be used for zero-shot image classification, image search, and content
  moderation without any task-specific fine-tuning.
use_case: Image Classification
tags:
- foundation
applicable_scenarios:
- Image Search
- Content Moderation
- Zero-Shot Classification
related_models:
- openai_clip
form_factors:
- Phone
- Tablet
has_static_banner: true
has_animated_banner: false
dataset:
- imagenet
technical_details:
  Model checkpoint: google/siglip2-base-patch16-224
  Image input resolution: 224x224
  Text sequence length: '64'
  Model size (image_encoder) (float): 352 MB
  Model size (text_encoder) (float): 1.05 GB
  Model size (image_encoder) (w8a16): 92.8 MB
  Model size (text_encoder) (w8a16): 461 MB
license_type: apache-2.0
research_paper: https://arxiv.org/abs/2502.14786
research_paper_title: 'SigLIP 2: Multilingual Vision-Language Encoders with Improved
  Semantic Understanding, Localization, and Dense Features'
source_repo: https://huggingface.co/google/siglip2-base-patch16-224
