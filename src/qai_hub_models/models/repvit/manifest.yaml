name: RepViT
id: repvit
status: pending
headline: Imagenet classifier optimized for mobile devices.
domain: Computer Vision
description: RepViT is a lightweight pure CNN model for mobile devices, incorporating
  efficient architectural designs from Vision Transformers into CNNs. It achieves
  over 80% top-1 accuracy on ImageNet with 1ms latency on an iPhone 12.
use_case: Image Classification
tags:
- backbone
applicable_scenarios:
- Medical Imaging
- Anomaly Detection
- Inventory Management
